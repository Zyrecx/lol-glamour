# Website (SPEC "Publishing"): site/ plus the README images in img/, deployed to GitHub Pages on every push to main that touches them.
# Needs repo Settings > Pages > Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/readme/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r .github/readme _site/img

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
